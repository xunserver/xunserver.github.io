<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/blog/">
    <link rel="canonical" href="https://page.xunserver.cn/blog/">
    <title>正在跳转到博客</title>
    <script>
      const target = new URL('/blog/', window.location.origin)
      target.search = window.location.search
      target.hash = window.location.hash
      window.location.replace(target.href)
    </script>
  </head>
  <body>
    <p>正在跳转到 <a href="/blog/">/blog/</a>。</p>
  </body>
</html>
