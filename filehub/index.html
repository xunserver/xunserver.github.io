<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="FileHub：公开文件、加密下载与 OpenClash 订阅的独立分发中心" />
    <title>FileHub · 文件分发中心</title>
    <script>
      (() => {
        try {
          const legacy = ['filehub-theme', 'life-vault-theme', 'shuati-theme']
          let theme = localStorage.getItem('xunserver-theme')
          if (theme !== 'dark' && theme !== 'light') {
            for (const name of legacy) {
              const value = localStorage.getItem(name)
              if (value === 'dark' || value === 'light') {
                theme = value
                localStorage.setItem('xunserver-theme', value)
                break
              }
            }
          }
          const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches)
        }
      })()
    </script>
    <script type="module" crossorigin src="/filehub/assets/index-DfLiTwQE.js"></script>
    <link rel="stylesheet" crossorigin href="/filehub/assets/index-Du9KGmDT.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
