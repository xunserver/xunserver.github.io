<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="FileHub：公开文件、加密下载与 OpenClash 订阅的独立分发中心" />
    <title>FileHub · 文件分发中心</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('filehub-theme')
          const dark = theme === 'dark' || (theme === null && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches)
        }
      })()
    </script>
    <script type="module" crossorigin src="/filehub/assets/index-BfLngPyu.js"></script>
    <link rel="stylesheet" crossorigin href="/filehub/assets/index-EKRryFKQ.css">

  </body>
