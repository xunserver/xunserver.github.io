<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>开锁教程</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; background:#f5f5f5; color:#171717; }
    main { max-width:860px; margin:0 auto; padding:48px 20px 80px; }
    .card { background:#fff; border:1px solid #ddd; border-radius:14px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.04); }
    h1 { margin:0 0 8px; font-size:28px; }
    h2 { margin:28px 0 10px; font-size:18px; }
    p { line-height:1.65; color:#555; }
    label { display:block; margin:18px 0 8px; font-weight:650; }
    textarea,input { width:100%; box-sizing:border-box; border:1px solid #ccc; border-radius:9px; padding:11px 12px; font:inherit; background:#fff; color:#111; }
    textarea { min-height:180px; resize:vertical; line-height:1.55; }
    .row { display:flex; gap:10px; align-items:center; }
    .row input { flex:1; }
    button,.file-button { border:1px solid #111; border-radius:9px; background:#111; color:#fff; padding:10px 16px; font:inherit; font-weight:650; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    button.secondary,.file-button.secondary { background:transparent; color:#111; border-color:#bbb; }
    .file-button input { display:none; }
    .status { margin-top:14px; border-left:3px solid #777; padding:10px 12px; background:#f2f2f2; white-space:pre-wrap; }
    .status.ok { border-color:#18864b; }
    .status.error { border-color:#c0392b; color:#9d2b21; }
    .result { margin-top:24px; border-top:1px solid #ddd; padding-top:20px; }
    .hint { font-size:13px; color:#777; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    @media (prefers-color-scheme: dark) {
      body { background:#141414; color:#eee; }
      .card { background:#1d1d1d; border-color:#3a3a3a; }
      p,.hint { color:#aaa; }
      textarea,input { background:#111; color:#eee; border-color:#444; }
      button,.file-button { background:#eee; color:#111; border-color:#eee; }
      button.secondary,.file-button.secondary { background:transparent; color:#eee; border-color:#555; }
      .status { background:#222; }
      .result { border-color:#3a3a3a; }
    }
    @media (max-width:640px) { .row { align-items:stretch; flex-direction:column; } .row button,.row .file-button { width:100%; box-sizing:border-box; } }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>开锁教程</h1>
    <p>此页面完全在本机运行，不访问网络。选择保险箱，输入任意一把有效钥匙即可开锁。</p>
    <p class="hint">如果双击此 HTML 后浏览器提示 Web Crypto 不可用，请换用最新版 Chrome、Edge、Firefox 或 Safari 打开。</p>

    <h2>1. 载入保险箱</h2>
    <div class="row">
      <label class="file-button secondary" style="margin:0">
        <input id="fileInput" type="file" accept=".dat,.txt,.bin,text/plain,application/octet-stream">
        选择保险箱
      </label>
      <span id="fileName" class="hint">尚未选择文件</span>
    </div>

    <label for="ciphertext">也可以手动粘贴保险箱内容</label>
    <textarea id="ciphertext" spellcheck="false" placeholder="将保险箱的完整内容粘贴到这里"></textarea>

    <h2>2. 输入钥匙</h2>
    <div class="row">
      <input id="secret" type="password" autocomplete="off" placeholder="输入任意一把有效钥匙">
      <button id="unlockButton" type="button">开锁</button>
    </div>

    <div id="status" class="status" hidden></div>

    <div id="result" class="result" hidden>
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">已解密内容</h2>
        <button id="copyButton" class="secondary" type="button">复制明文</button>
      </div>
      <textarea id="plaintext" readonly style="min-height:320px;margin-top:12px"></textarea>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';

  const FORMAT = 'xun-estate-vault';
  const VERSION = 2;
  const KDF_ITERATIONS = 600000;
  const TAG_LENGTH = 128;
  const DEK_LENGTH = 32;
  const PAYLOAD_AAD = 'xun-estate-vault:v2:payload';
  const SLOT_AAD_PREFIX = 'xun-estate-vault:v2:key:';

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const ciphertext = document.getElementById('ciphertext');
  const secret = document.getElementById('secret');
  const unlockButton = document.getElementById('unlockButton');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const plaintext = document.getElementById('plaintext');
  const copyButton = document.getElementById('copyButton');

  function setStatus(message, type) {
    status.hidden = false;
    status.textContent = message;
    status.className = 'status' + (type ? ' ' + type : '');
  }

  function clearResult() {
    plaintext.value = '';
    result.hidden = true;
  }

  function base64ToBytes(value) {
    const normalized = value.replace(/\s+/g, '');
    const binary = atob(normalized);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function parseStoredVault(value) {
    const normalized = value.replace(/\s+/g, '');
    if (!normalized) throw new Error('保险箱内容为空。');

    let json;
    try {
      json = decoder.decode(base64ToBytes(normalized));
    } catch {
      throw new Error('文件不是有效的 Base64 数据。');
    }

    let record;
    try {
      record = JSON.parse(json);
    } catch {
      throw new Error('内容不是有效的保险箱。');
    }

    validateVaultRecord(record);
    return record;
  }

  function validateVaultRecord(record) {
    if (
      !record ||
      typeof record !== 'object' ||
      record.format !== FORMAT ||
      record.version !== VERSION ||
      record.kdf?.name !== 'PBKDF2' ||
      record.kdf?.hash !== 'SHA-256' ||
      record.kdf?.iterations !== KDF_ITERATIONS ||
      record.cipher?.name !== 'AES-GCM' ||
      record.cipher?.tagLength !== TAG_LENGTH ||
      !Array.isArray(record.recipients) ||
      record.recipients.length === 0 ||
      typeof record.payload?.iv !== 'string' ||
      typeof record.payload?.ciphertext !== 'string'
    ) {
      throw new Error('不支持或损坏的保险箱格式。');
    }

    for (const slot of record.recipients) {
      if (
        !slot ||
        typeof slot.id !== 'string' ||
        typeof slot.salt !== 'string' ||
        typeof slot.iv !== 'string' ||
        typeof slot.wrappedKey !== 'string'
      ) {
        throw new Error('保险箱里的钥匙记录格式错误。');
      }
    }
  }

  async function deriveKek(inputSecret, salt) {
    const material = await crypto.subtle.importKey(
      'raw',
      encoder.encode(inputSecret),
      'PBKDF2',
      false,
      ['deriveKey']
    );

    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        hash: 'SHA-256',
        iterations: KDF_ITERATIONS,
        salt
      },
      material,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  function readSlot(slot) {
    try {
      const salt = base64ToBytes(slot.salt);
      const iv = base64ToBytes(slot.iv);
      const wrappedKey = base64ToBytes(slot.wrappedKey);
      if (salt.byteLength !== 16 || iv.byteLength !== 12 || wrappedKey.byteLength !== DEK_LENGTH + 16) return null;
      return { salt, iv, wrappedKey };
    } catch {
      return null;
    }
  }

  async function decryptVault(raw, inputSecret) {
    if (!globalThis.crypto?.subtle) {
      throw new Error('当前浏览器无法使用 Web Crypto。');
    }

    const record = parseStoredVault(raw);
    const payloadDamaged = '保险箱内容已损坏。';
    let sawCorrupt = false;
    let sawMismatch = false;

    for (const slot of record.recipients) {
      const material = readSlot(slot);
      if (!material) {
        sawCorrupt = true;
        continue;
      }

      try {
        const kek = await deriveKek(inputSecret, material.salt);
        const dekBytes = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: material.iv,
            additionalData: encoder.encode(SLOT_AAD_PREFIX + slot.id),
            tagLength: TAG_LENGTH
          },
          kek,
          material.wrappedKey
        );

        if (dekBytes.byteLength !== DEK_LENGTH) {
          sawCorrupt = true;
          continue;
        }

        const dek = await crypto.subtle.importKey('raw', dekBytes, 'AES-GCM', false, ['decrypt']);
        let payloadIv;
        let payloadBytes;
        try {
          payloadIv = base64ToBytes(record.payload.iv);
          payloadBytes = base64ToBytes(record.payload.ciphertext);
        } catch {
          throw new Error(payloadDamaged);
        }
        if (payloadIv.byteLength !== 12) throw new Error(payloadDamaged);

        let plain;
        try {
          plain = await crypto.subtle.decrypt(
            {
              name: 'AES-GCM',
              iv: payloadIv,
              additionalData: encoder.encode(PAYLOAD_AAD),
              tagLength: TAG_LENGTH
            },
            dek,
            payloadBytes
          );
        } catch {
          throw new Error(payloadDamaged);
        }

        return decoder.decode(plain);
      } catch (error) {
        if (error instanceof Error && error.message === payloadDamaged) throw error;
        sawMismatch = true;
      }
    }

    if (sawCorrupt && sawMismatch) throw new Error('钥匙不正确，且存在损坏的钥匙槽。');
    if (sawCorrupt) throw new Error('钥匙槽已损坏。');
    throw new Error('钥匙不正确。');
  }

  fileInput.addEventListener('change', async () => {
    clearResult();
    const file = fileInput.files?.[0];
    if (!file) return;

    try {
      const text = await file.text();
      parseStoredVault(text);
      ciphertext.value = text;
      fileName.textContent = file.name;
      setStatus('已在本机载入保险箱。', 'ok');
    } catch (error) {
      fileName.textContent = '文件读取失败';
      setStatus(error instanceof Error ? error.message : '无法读取文件。', 'error');
    } finally {
      fileInput.value = '';
    }
  });

  unlockButton.addEventListener('click', async () => {
    clearResult();

    if (!ciphertext.value.trim()) {
      setStatus('请先选择保险箱，或粘贴保险箱内容。', 'error');
      return;
    }

    if (!secret.value) {
      setStatus('请输入钥匙。', 'error');
      return;
    }

    unlockButton.disabled = true;
    unlockButton.textContent = '开锁中…';

    try {
      const value = await decryptVault(ciphertext.value, secret.value);
      plaintext.value = value;
      result.hidden = false;
      secret.value = '';
      setStatus('开锁成功。所有计算均在本机完成。', 'ok');
    } catch (error) {
      setStatus(error instanceof Error ? error.message : '解密失败。', 'error');
    } finally {
      unlockButton.disabled = false;
      unlockButton.textContent = '开锁';
    }
  });

  secret.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') unlockButton.click();
  });

  copyButton.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(plaintext.value);
      setStatus('明文已复制到剪贴板。', 'ok');
    } catch {
      plaintext.focus();
      plaintext.select();
      setStatus('浏览器未允许自动复制，请使用 Ctrl/Cmd + C。');
    }
  });
})();
</script>
</body>
</html>
